
name: QualityHub CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test QualityHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: >
          mvn -B -f automation/pom.xml
          exec:java
          -Dexec.classpathScope=test
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Start backend
        run: |
          nohup mvn -B -f backend/pom.xml spring-boot:run > backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/tasks > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start."
          cat backend.log
          exit 1

      - name: Start frontend
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "Frontend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start."
          cat frontend.log
          exit 1

      - name: Run API and UI automation tests
        run: mvn -B -f automation/pom.xml clean test

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn -B -f automation/pom.xml allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualityhub-test-reports
          path: |
            automation/target/site/allure-maven-plugin/
            automation/target/allure-results/
            automation/target/surefire-reports/
            backend.log
            frontend.log
          if-no-files-found: ignore
